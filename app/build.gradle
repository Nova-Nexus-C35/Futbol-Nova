plugins {
    id 'com.android.application'
}

def gdxVersion = providers.gradleProperty('gdxVersion').get()

configurations {
    gdxNatives
}

android {
    namespace 'com.novanexus.futbolnova'
    compileSdk 36
    defaultConfig {
        applicationId 'com.novanexus.futbolnova'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }

    // gdx-gltf publishes identical shader resources from multiple modules.
    // Keep one canonical copy so Android's Java-resource merge can package the APK.
    packaging {
        resources {
            pickFirsts += ['net/mgsx/gltf/shaders/**']
        }
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    // Optional GLB humanoid renderer; procedural PlayerVisual remains the safe fallback.
    implementation "com.github.mgsx-dev.gdx-gltf:gltf:2.3.0"
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
    gdxNatives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    testImplementation 'junit:junit:4.13.2'
    // libGDX math/camera code calls native helpers; desktop natives are test-only.
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
}


tasks.register('copyGdxNatives', Copy) {
    from { zipTree(configurations.gdxNatives.singleFile) }
    include '*.so'
    eachFile { details -> details.path = details.name }
    includeEmptyDirs = false
    into file("$projectDir/src/main/jniLibs/arm64-v8a")
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyGdxNatives')
}
