name: Fútbol Nova Android CI

on:
  push:
    branches:
      - rebuild/libgdx-android-2026-11-22
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build ARM64 debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify ARM64 native runtime is packaged
        run: unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'lib/arm64-v8a/libgdx.so'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-android-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push'
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: futbol-nova-android-arm64-debug
          path: release-assets
      - name: Publish persistent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Fútbol Nova — APK debug #${{ github.run_number }}
          body: |
            APK de depuración ARM64 generado automáticamente.
            Incluye ejecución de pruebas unitarias y verificación del runtime nativo libgdx.so.
            Rama: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: release-assets/app-debug.apk
