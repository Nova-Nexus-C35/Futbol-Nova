name: Fútbol Nova Android CI

on:
  push:
    branches:
      - rebuild/libgdx-android-2026-11-22
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-glb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js for Ara 3D Gen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Ara character data
        uses: actions/cache@v4
        with:
          path: .ara3d-cache
          key: ara3d-data-0.18.1
      - name: Generate realistic home and away footballers
        env:
          ARA3D_CACHE: ${{ github.workspace }}/.ara3d-cache
          ARA3D_VERSION: '0.18.1'
          FOOTBALL_CLIPS: 'idle,walk,run,soccer_shoot,soccer_pass,soccer_side_pass_left,soccer_side_pass_forward,soccer_side_pass_right,soccer_receive,soccer_header,soccer_jump_header,soccer_chest_control,standing_tackle,slide_tackle,keeper_ready,keeper_catch,keeper_punch,keeper_dive_left,keeper_dive_right,keeper_low_dive_left,keeper_low_dive_right,ball_pick_up,ball_bounce,throw_side_right,throw_side_left,throw_two_hands,throw_in,throw_low_right,throw_low_left,siu_celebration'
        run: |
          npx -y "ara3d@${ARA3D_VERSION}" export --params Assets/Players/characters/home.json --formats glb --detail high --animations "${FOOTBALL_CLIPS}" --out /tmp/nova-home
          npx -y "ara3d@${ARA3D_VERSION}" export --params Assets/Players/characters/away.json --formats glb --detail high --animations "${FOOTBALL_CLIPS}" --out /tmp/nova-away
          mkdir -p app/src/main/assets/models/players
          cp "$(find /tmp/nova-home -maxdepth 1 -type f -name '*.glb' -print -quit)" app/src/main/assets/models/players/home.glb
          cp "$(find /tmp/nova-away -maxdepth 1 -type f -name '*.glb' -print -quit)" app/src/main/assets/models/players/away.glb
          test -s app/src/main/assets/models/players/home.glb
          test -s app/src/main/assets/models/players/away.glb
      - name: Validate both GLB models and football animation clips
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          for name in ('home.glb', 'away.glb'):
              path = Path('app/src/main/assets/models/players') / name
              data = path.read_bytes()
              magic, version, length, json_length, json_type = struct.unpack_from('<5I', data, 0)
              assert magic == 0x46546c67 and version == 2 and length == len(data), name
              assert json_type == 0x4e4f534a and 20 + json_length <= len(data), name
              doc = json.loads(data[20:20 + json_length].decode('utf-8').rstrip(' \\t\\r\\n\\0'))
              assert doc.get('skins'), f'{name}: no skinned mesh'
              animations = [a.get('name', '').lower() for a in doc.get('animations', [])]
              assert animations, f'{name}: no animation clips'
              normalized = [''.join(ch for ch in clip.lower() if ch.isalnum()) for clip in animations]
              required = {
                  'idle': 'idle', 'walk': 'walk', 'run': 'run',
                  'shot': 'shoot', 'pass': 'pass', 'receive': 'receive',
                  'header': 'header', 'chest control': 'chestcontrol',
                  'standing tackle': 'standingtackle', 'slide tackle': 'slidetackle',
                  'goalkeeper catch': 'keepercatch', 'goalkeeper punch': 'keeperpunch',
                  'left goalkeeper dive': 'keeperdiveleft', 'right goalkeeper dive': 'keeperdiveright',
                  'throw-in': 'throwin', 'celebration': 'siucelebration',
              }
              missing = [label for label, token in required.items()
                         if not any(token in clip for clip in normalized)]
              assert not missing, f'{name}: missing football clips: {missing}; found={animations}'
              print(f'{name}: {len(data)} bytes, {len(doc.get("nodes", []))} nodes, {len(doc["skins"])} skins, {len(animations)} validated clips')
          PY
      - name: Commit generated player assets to the development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/libgdx-android-2026-11-22'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/models/players/home.glb app/src/main/assets/models/players/away.glb
          if ! git diff --cached --quiet; then
            git commit -m "Add generated high-detail home and away footballers"
            git push origin HEAD:rebuild/libgdx-android-2026-11-22
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build ARM64 debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify ARM64 native runtime and both player models are packaged
        run: |
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'lib/arm64-v8a/libgdx.so'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/models/players/home.glb'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/models/players/away.glb'
      - name: Upload generated player models
        uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-realistic-player-models
          path: |
            app/src/main/assets/models/players/home.glb
            app/src/main/assets/models/players/away.glb
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-android-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push'
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: futbol-nova-android-arm64-debug
          path: release-assets
      - name: Publish persistent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Fútbol Nova — APK debug #${{ github.run_number }}
          body: |
            APK de depuración ARM64 generado automáticamente.
            Incluye ejecución de pruebas unitarias y verificación del runtime nativo libgdx.so.
            Rama: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: release-assets/app-debug.apk
