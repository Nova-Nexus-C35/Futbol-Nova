name: Unity validation and Android build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build an Android APK after EditMode tests pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  editmode-tests:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.3.24f1
          testMode: editmode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          path: artifacts
          if-no-files-found: warn

  android-apk:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    needs: editmode-tests
    if: ${{ inputs.build_android }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.3.24f1
          targetPlatform: Android
          buildMethod: FutbolNova.Editor.FutbolNovaBuild.BuildAndroid
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-android-apk
          path: Build/FutbolNova.apk
          if-no-files-found: error
