name: Unity validation and Android build

on:
  push:
    branches:
      - feature/rebuild-unity-android-foundation-2026-11-22
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build an Android APK after EditMode tests pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

jobs:
  editmode-tests:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Configure UNITY_EMAIL and UNITY_PASSWORD Actions secrets for your Unity account."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Configure UNITY_LICENSE (Personal) or UNITY_SERIAL (Professional) as an Actions secret."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.24f1
          testMode: editmode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          path: artifacts
          if-no-files-found: warn

  android-apk:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: editmode-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android }}
    steps:
      - name: Validate Unity license secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Configure UNITY_EMAIL and UNITY_PASSWORD Actions secrets for your Unity account."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Configure UNITY_LICENSE (Personal) or UNITY_SERIAL (Professional) as an Actions secret."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.24f1
          targetPlatform: Android
          buildMethod: FutbolNova.Editor.FutbolNovaBuild.BuildAndroid
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-android-apk
          path: Build/FutbolNova.apk
          if-no-files-found: error
