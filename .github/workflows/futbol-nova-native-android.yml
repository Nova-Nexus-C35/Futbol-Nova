name: Fútbol Nova — Android nativo ARM64
on:
  push:
    branches: [main, "work/native-engine-mainline", "work/native-3d-engine"]
    paths:
      - "native-android/**"
      - "data/**"
      - "tools/validate_native_data.py"
      - ".github/workflows/futbol-nova-native-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "native-android/**"
      - "data/**"
      - "tools/validate_native_data.py"
      - ".github/workflows/futbol-nova-native-android.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futbol-nova-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-native-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Validate canonical offline football data
        run: python3 tools/validate_native_data.py
      - name: Build native Android debug APK
        working-directory: native-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and ARM64 native library
        shell: bash
        run: |
          APK="native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libfutbolnova.so"
          unzip -l "$APK" | grep -q "assets/native_runtime_manifest.json"
          echo "Native Android APK and ARM64 library verified."
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: futbol-nova-native-android-arm64
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
