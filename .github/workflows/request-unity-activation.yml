name: Request Unity activation file

on:
  push:
    branches:
      - feature/rebuild-unity-android-foundation-2026-11-22
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Generate manual Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: unity-manual-activation-request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
