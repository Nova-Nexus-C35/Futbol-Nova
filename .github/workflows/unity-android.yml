name: Build Fútbol Nova Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "vendor/Soccer-27"
      - ".github/workflows/unity-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "vendor/Soccer-27"
      - ".github/workflows/unity-android.yml"

jobs:
  build-unity-android:
    name: Build Unity 6.3 Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fútbol Nova and initialize source submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Unity license is configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Add the UNITY_LICENSE repository secret before running the Unity Android build."
            exit 1
          fi

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: vendor/Soccer-27/unity/FC2026Unity
          unityVersion: 6000.3.24f1
          targetPlatform: Android
          buildMethod: FC2026.EditorTools.AndroidBuilder.BuildAndroid

      - name: Upload Fútbol Nova Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Futbol-Nova-Unity-Android-APK
          path: vendor/Soccer-27/unity/FC2026Unity/Builds/Android/Soccer-27-debug.apk
          if-no-files-found: error
          retention-days: 14
