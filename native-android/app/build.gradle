plugins { id 'com.android.application' }

android {
    sourceSets { main { assets.srcDirs += ['../../data'] } }
    namespace 'com.nova.futbolnova'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.nova.futbolnova'
        minSdk 28
        targetSdk 28
        versionCode 2
        versionName '0.2.0-native'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror=return-type' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
